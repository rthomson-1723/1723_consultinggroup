<!DOCTYPE html>
<html>
<head>
    <title>Submission Successful</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .message-box {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #28a745;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            margin: 0 auto 20px;
        }

        h2 {
            color: #28a745;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: navy;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .home-btn:hover {
            background: #001f5b;
        }
    </style>
</head>

<body>

<div class="message-box">

    <div class="check-icon">
        ✓
    </div>

    <h2>Submission Successful!</h2>

    <p>
        Thank you for your submission. We have received your information 
        and will process it shortly. You will receive a confirmation email 
        within the next few minutes.
    </p>

    <a href="{% url back_url %}" class="home-btn">
        {{ back_text }}
    </a>

</div>

</body>
</html>
